<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101114" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wake Street Hero" />
    <meta name="description" content="WHY NOT: Wake Street Hero — 3D winch street wakeboarding & wakeskating." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>WHY NOT: Wake Street Hero</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101114; color: #fff; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      /* 100dvh follows the mobile URL bar; position:fixed + inset keeps older browsers working. */
      #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #101114; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      #hud, #ui { position: absolute; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud"></div>
      <div id="ui"></div>
    </div>
    <noscript><p style="position:fixed;inset:0;margin:0;padding:24px;display:flex;align-items:center;justify-content:center;text-align:center;font:600 16px system-ui,sans-serif">WHY NOT: Wake Street Hero — включи JavaScript / please enable JavaScript.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
