<script>
// Several agents edit the code base at once: without this the shared dev server would reload the
// sandbox in the middle of a screenshot session. ?hmr=1 turns live reload back on.
if (new URLSearchParams(location.search).get('hmr') !== '1') {
  window.WebSocket = class { constructor() { this.readyState = 0; } addEventListener() {} removeEventListener() {} send() {} close() {} };
}
</script>
