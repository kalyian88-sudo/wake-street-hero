<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>env sandbox</title>
<script>
// The shared dev server reloads every open page whenever ANY file changes (other modules are being
// edited all the time). This sandbox opts out of HMR so screenshots are not cut short by a reload.
(function () {
  var Real = window.WebSocket;
  window.WebSocket = function (url, proto) {
    if (proto === 'vite-hmr' || proto === 'vite-ping') return { addEventListener: function () {}, removeEventListener: function () {}, send: function () {}, close: function () {}, readyState: 0 };
    return new Real(url, proto);
  };
})();
</script>
<style>html,body{margin:0;height:100%;background:#101114;overflow:hidden}canvas{display:block;width:100%;height:100%}#info{position:fixed;left:6px;bottom:6px;font:11px/1.3 monospace;color:#fff;opacity:.75;text-shadow:0 0 3px #000;pointer-events:none;white-space:pre}</style></head>
<body><canvas id="c"></canvas><div id="info"></div><script type="module" src="/src/dev/env.ts"></script></body></html>
