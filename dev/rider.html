<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
    <title>Rider rig sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101114;
        overflow: hidden;
        font: 12px/1.3 system-ui, sans-serif;
        color: #fff;
      }
      canvas {
        display: block;
        position: absolute;
        inset: 0;
      }
      #labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #labels span {
        position: absolute;
        padding: 2px 6px;
        background: rgba(16, 17, 20, 0.72);
        border-left: 3px solid #e30613;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #ui {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 34%;
        overflow: auto;
        padding: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        background: rgba(16, 17, 20, 0.6);
      }
      #ui button {
        font: inherit;
        color: #fff;
        background: #2a2c33;
        border: 0;
        border-radius: 4px;
        padding: 5px 7px;
      }
      #ui button.on {
        background: #e30613;
      }
      body.clean #ui {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div id="ui"></div>
    <script type="module" src="/src/dev/rider.ts"></script>
  </body>
</html>
