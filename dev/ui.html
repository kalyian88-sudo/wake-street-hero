<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>UI sandbox — WHY NOT: Wake Street Hero</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101114; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; }
      #ui { position: absolute; inset: 0; pointer-events: none; }
      /* Stand-in for the 3D view: a blurred "canal at golden hour". */
      #fake3d { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #f1c58d 0%, #e9b98a 22%, #9fb7ad 44%, #2f7f7b 52%, #155a5e 74%, #0c3c44 100%); }
      #fake3d i { position: absolute; border-radius: 12%; filter: blur(22px); }
      #fake3d .b1 { left: -8%; top: 16%; width: 44%; height: 36%; background: #c9744a; }
      #fake3d .b2 { right: -6%; top: 20%; width: 40%; height: 32%; background: #e9d9b8; }
      #fake3d .b3 { left: 30%; top: 30%; width: 18%; height: 20%; background: #7d8a92; opacity: .8; }
      #fake3d .w1 { left: 20%; top: 60%; width: 60%; height: 10%; background: #9fe0d2; opacity: .35; border-radius: 50%; }
      #fake3d .r1 { left: 44%; top: 56%; width: 12%; height: 16%; background: #e30613; opacity: .7; border-radius: 40%; }
      #fake3d[data-kind='hub'], #fake3d[data-kind='splash'] { background: radial-gradient(90% 60% at 60% 45%, #1e2733 0%, #12151b 60%, #0b0c0f 100%); }
      #fake3d[data-kind='hub'] i, #fake3d[data-kind='splash'] i, #fake3d[data-kind='rider'] i { display: none; }
      #fake3d[data-kind='city'] { background: linear-gradient(180deg, #27313a 0%, #1a2228 50%, #101418 100%); }
      #fake3d[data-kind='city'] i { opacity: .25; }
      #fake3d[data-kind='rider'] { background: radial-gradient(70% 50% at 50% 40%, #3a3f4a 0%, #1b1d22 70%, #0f1013 100%); }
      #runlabel { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font: italic 900 22px/1.3 system-ui, sans-serif; color: #fff; text-align: center; text-shadow: 0 2px 12px rgba(0, 0, 0, .6); display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="fake3d" data-kind="run"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="w1"></i><i class="r1"></i></div>
      <div id="runlabel"></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/dev/ui.ts"></script>
  </body>
</html>
