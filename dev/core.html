<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>core sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101114; color: #fff; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #101114; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #hud, #ui { position: absolute; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud"></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/dev/core.ts"></script>
  </body>
</html>
